<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Economia familiar</title>
<style>
:root{--bg:#f2f4f1;--surface:#fbfcfa;--ink:#16201c;--ink-2:#4b5650;--rule:#d9ded8;--accent:#1d6b55;--bad:#c2413b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121715;--surface:#1a201d;--ink:#e9eee9;--ink-2:#b3bdb6;--rule:#2c3531;--accent:#5cc09c;--bad:#ec7a73;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:24px;line-height:1.1}
p{margin:0;color:var(--ink-2);font-size:14px}
label{font-size:13px;color:var(--ink-2)}
input{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.chk input{width:auto}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Economia familiar</h1>
  <p>Aquesta pàgina està xifrada. Escriu la contrasenya per veure-la.</p>
  <input type="text" name="username" value="economia-familiar" autocomplete="username" hidden>
  <div style="display:grid;gap:6px"><label for="pw">Contrasenya</label><input id="pw" type="password" autocomplete="current-password" required autofocus></div>
  <label class="chk"><input type="checkbox" id="rem"> Recorda-la en aquest dispositiu</label>
  <button id="go" type="submit">Obre</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  if(!P.gz)return new TextDecoder().decode(pt);
  return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Obrint…";
  const pw=document.getElementById("pw").value;
  try{const html=await open(pw);try{if(document.getElementById("rem").checked)localStorage.setItem("ef-pw",pw)}catch(_){}show(html)}
  catch(x){err.textContent="La contrasenya no és correcta.";go.disabled=false;go.textContent="Obre"}});
(async()=>{let s=null;try{s=localStorage.getItem("ef-pw")}catch(_){}
  if(s){try{show(await open(s))}catch(_){try{localStorage.removeItem("ef-pw")}catch(__){}}}})();
</script>
